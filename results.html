<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>النتائج المباشرة | معركة الأوامر</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg,#fff0f6,#eef8ff,#f5efff);
  color: #17223b;
  padding: 30px;
}

main {
  max-width: 1100px;
  margin: auto;
  text-align: center;
}

h1 {
  font-size: clamp(40px,6vw,70px);
  color: #6042d6;
  margin: 10px;
}

.subtitle {
  font-size: 24px;
}

.total {
  font-size: 28px;
  margin: 25px;
}

.box {
  background: white;
  border-radius: 28px;
  padding: 35px;
  box-shadow: 0 18px 50px #4c3b7b20;
}

.row {
  display: grid;
  grid-template-columns: 100px 1fr 120px;
  gap: 18px;
  align-items: center;
  margin: 35px 0;
  font-size: 32px;
  font-weight: bold;
}

.track {
  height: 60px;
  background: #eeeeee;
  border-radius: 99px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0;
  transition: width .6s ease;
  border-radius: 99px;
}

#barA {
  background: linear-gradient(90deg,#ff5f91,#ff8db2);
}

#barB {
  background: linear-gradient(90deg,#37a8e8,#6bc8ff);
}

.count {
  font-size: 19px;
  color: #687083;
}

#status {
  margin: 25px;
  font-size: 18px;
  color: #6042d6;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 13px 22px;
  background: #6042d6;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width:650px) {
  .row {
    grid-template-columns:55px 1fr 75px;
    font-size:22px;
  }

  .track {
    height:45px;
  }
}
</style>
</head>

<body>

<main>

<h1>⚔️ معركة الأوامر</h1>

<p class="subtitle">
📊 نتائج التصويت المباشر
</p>

<div class="total">
إجمالي المشاركات:
<b id="total">0</b>
</div>

<section class="box">

<div class="row">
<span>أ</span>

<div class="track">
<div id="barA" class="bar"></div>
</div>

<span id="pa">0%</span>
</div>

<div class="count">
عدد أصوات الأمر (أ):
<b id="ca">0</b>
</div>


<div class="row">
<span>ب</span>

<div class="track">
<div id="barB" class="bar"></div>
</div>

<span id="pb">0%</span>
</div>

<div class="count">
عدد أصوات الأمر (ب):
<b id="cb">0</b>
</div>

<p id="status">
بانتظار التصويت... ⏳
</p>

<button id="reset">
🔄 تصفير النتائج
</button>

</section>

</main>

<script>

const $ = id => document.getElementById(id);

if (!firebase.apps.length) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
}

const database = firebase.database();

const votes =
database.ref("promptBattle/votes");

votes.on("value", snapshot => {

  const data = snapshot.val() || {};

  const A = data.A || 0;
  const B = data.B || 0;

  const total = A + B;

  const percentA =
    total ? Math.round((A / total) * 100) : 0;

  const percentB =
    total ? 100 - percentA : 0;

  $("total").textContent = total;

  $("ca").textContent = A;
  $("cb").textContent = B;

  $("pa").textContent = percentA + "%";
  $("pb").textContent = percentB + "%";

  $("barA").style.width =
    percentA + "%";

  $("barB").style.width =
    percentB + "%";

  $("status").textContent =
    total
    ? "✨ النتائج تتحدث مباشرة"
    : "بانتظار التصويت... ⏳";

});

$("reset").onclick = async () => {

  const ok =
    confirm("هل تريدين تصفير جميع الأصوات؟");

  if (ok) {

    await votes.set({
      A: 0,
      B: 0
    });

  }
};

</script>

</body>
</html>
